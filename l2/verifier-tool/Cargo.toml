[package]
name = "alephium-l2-verifier-tool"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
alephium-l2-sdk = { path = "../sdk" }
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
ark-bn254 = "=0.6.0"
ark-ec = "=0.6.0"
ark-ff = "=0.6.0"
blake2 = "=0.10.6"
hex = "=0.4.3"
num-bigint = "=0.4.8"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
