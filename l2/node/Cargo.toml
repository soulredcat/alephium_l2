[package]
name = "alephium-l2-node"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
default-run = "alephium-l2-node"

[features]
cuda = ["dep:alephium-l2-gpu"]

[dependencies]
alephium-l2-sdk = { path = "../sdk" }
alephium-l2-gpu = { path = "../gpu", optional = true }
revm = { version = "=43.0.3", default-features = false, features = ["std", "secp256k1", "portable"] }
fjall = "=3.1.12"
alloy-consensus = { version = "=2.5.0", features = ["k256", "secp256k1"] }
alloy-eips = "=2.5.0"
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
alloy-signer = "=2.5.0"
alloy-signer-local = "=2.5.0"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
alloy-rpc-types-eth = "=2.5.0"
tempfile = "=3.23.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
