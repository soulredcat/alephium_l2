[workspace]
resolver = "3"
members = ["core", "guest", "host"]

[workspace.package]
edition = "2024"
publish = false
rust-version = "1.94.1"

[workspace.dependencies]
alephium-l2-transition-core = { path = "core" }
revm = { version = "=43.0.3", default-features = false, features = ["std", "portable"] }
alloy-consensus = { version = "=2.5.0", features = ["k256"] }
alloy-eips = "=2.5.0"
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
hex = "=0.4.3"
risc0-zkvm = { git = "https://github.com/risc0/risc0", rev = "14b5d588dd01cf4f7ba804d8bb0a61264e6ae2c6", default-features = false }
risc0-binfmt = { git = "https://github.com/risc0/risc0", rev = "14b5d588dd01cf4f7ba804d8bb0a61264e6ae2c6", default-features = false, features = ["std"] }
risc0-zkos-v1compat = { git = "https://github.com/risc0/risc0", rev = "14b5d588dd01cf4f7ba804d8bb0a61264e6ae2c6", default-features = false }

# Stable legacy bigint syscall support for the pinned RV32IM guest. Native
# arithmetic remains selected outside the guest target; no unstable bigint2.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", rev = "f913b0aa4646e85d4a2095742ce86abf25bb1354" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", rev = "3ab63a6f1048833f7047d5a50532e4a4cc789384" }

[profile.release]
overflow-checks = true
panic = "abort"
