[package]
name = "alephium-l2-sdk"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
blake2 = "=0.10.6"
bs58 = "=0.5.1"
secp256k1 = { version = "=0.31.1", default-features = false, features = ["std"] }
alloy-consensus = { version = "=2.5.0", features = ["k256"] }
alloy-eips = "=2.5.0"
alloy-primitives = { version = "=1.6.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hex = "0.4"

[dev-dependencies]
sha2 = "=0.10.9"

[[test]]
name = "contract_state_hash_checks"
path = "../../test/sdk/contract_state_hash_checks.rs"
